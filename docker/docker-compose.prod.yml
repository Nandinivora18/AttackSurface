version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelscan-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set for production deployment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production deployment}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set for production deployment}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-network

  redis:
    image: redis:7-alpine
    container_name: sentinelscan-redis-prod
    restart: always
    # Require a password — set REDIS_PASSWORD in your deployment environment.
    # Never hardcode the password here.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set for production deployment}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sentinelscan-backend-prod
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set for production (min 32 chars)}
      - ENVIRONMENT=production
      - DEBUG=false
      - REQUIRE_EMAIL_VERIFICATION=${REQUIRE_EMAIL_VERIFICATION:-true}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL must be set for production (e.g. https://sentinelscan.io)}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@sentinelscan.io}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-SentinelScan}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-${FRONTEND_URL}/api/auth/google/callback}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_GEMINI_API_KEY=${AI_GEMINI_API_KEY:-}
      - AI_GEMINI_MODEL=${AI_GEMINI_MODEL:-models/gemini-3.6-flash}
      - AI_OPENAI_API_KEY=${AI_OPENAI_API_KEY:-}
      - AI_OPENAI_MODEL=${AI_OPENAI_MODEL:-gpt-4o-mini}
      - AI_OPENAI_BASE_URL=${AI_OPENAI_BASE_URL:-}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel-network

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sentinelscan-worker-prod
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set for production (min 32 chars)}
      - ENVIRONMENT=production
      - DEBUG=false
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-5}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_GEMINI_API_KEY=${AI_GEMINI_API_KEY:-}
      - AI_GEMINI_MODEL=${AI_GEMINI_MODEL:-models/gemini-3.6-flash}
      - AI_OPENAI_API_KEY=${AI_OPENAI_API_KEY:-}
      - AI_OPENAI_MODEL=${AI_OPENAI_MODEL:-gpt-4o-mini}
      - AI_OPENAI_BASE_URL=${AI_OPENAI_BASE_URL:-}
    command: python run_worker.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Wait for migrations to finish (backend runs `alembic upgrade head` before
      # uvicorn starts) — otherwise the worker's startup reconcile hits a missing table.
      backend:
        condition: service_healthy
    # The backend image ships a HEALTHCHECK that probes GET /api/health on :8000,
    # but the worker does NOT run uvicorn. Override it so the worker is actually
    # health-checked against its own process instead of a dead HTTP port.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; (print('ok',flush=True),sys.exit(0)) if os.path.exists('/proc/1/cmdline') and b'run_worker.py' in open('/proc/1/cmdline','rb').read() else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - sentinel-network
    # To scale to multiple workers: docker compose up --scale worker=2

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are baked into the browser bundle at BUILD time — never
        # injected at runtime. FRONTEND_URL is the single source for the public
        # frontend origin; the API defaults to the same origin (nginx proxies /api → backend).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${FRONTEND_URL}}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-${FRONTEND_URL}}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-SentinelScan}
    container_name: sentinelscan-frontend-prod
    restart: always
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: sentinelscan-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - sentinel-network

volumes:
  pgdata_prod:

networks:
  sentinel-network:
    driver: bridge
