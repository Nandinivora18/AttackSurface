version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelscan-db-dev
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_password
      POSTGRES_DB: sentinelscan
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelscan"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinelscan-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sentinelscan-backend-dev
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel:sentinel_password@postgres:5432/sentinelscan
      - SYNC_DATABASE_URL=postgresql://sentinel:sentinel_password@postgres:5432/sentinelscan
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev_secret_key_change_in_production_32chars
      - ENVIRONMENT=development
      - DEV_BYPASS_EMAIL_VERIFICATION=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sentinelscan-worker-dev
    command: python run_worker.py
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel:sentinel_password@postgres:5432/sentinelscan
      - SYNC_DATABASE_URL=postgresql://sentinel:sentinel_password@postgres:5432/sentinelscan
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev_secret_key_change_in_production_32chars
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Wait for migrations (backend runs `alembic upgrade head` first) so the
      # worker's startup reconcile never hits a missing table.
      backend:
        condition: service_healthy
    # The backend image ships a HEALTHCHECK that probes GET /api/health, but the
    # worker does NOT run uvicorn. Override so the worker is health-checked by its
    # own process instead of a dead HTTP port.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; (print('ok',flush=True),sys.exit(0)) if os.path.exists('/proc/1/cmdline') and b'run_worker.py' in open('/proc/1/cmdline','rb').read() else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-SentinelScan}
    container_name: sentinelscan-frontend-dev
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata_dev:
