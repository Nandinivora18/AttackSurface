version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelscan-db-dev
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_password
      POSTGRES_DB: sentinelscan
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelscan"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinelscan-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sentinelscan-backend-dev
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel:sentinel_password@postgres:5432/sentinelscan
      - SYNC_DATABASE_URL=postgresql://sentinel:sentinel_password@postgres:5432/sentinelscan
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev_secret_key_change_in_production_32chars
      - ENVIRONMENT=development
      - DEV_BYPASS_EMAIL_VERIFICATION=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sentinelscan-worker-dev
    command: python run_worker.py
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel:sentinel_password@postgres:5432/sentinelscan
      - SYNC_DATABASE_URL=postgresql://sentinel:sentinel_password@postgres:5432/sentinelscan
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev_secret_key_change_in_production_32chars
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sentinelscan-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata_dev:
