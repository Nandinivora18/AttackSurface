version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# SentinelScan all-in-one stack (Postgres + Redis + API + Worker + Frontend)
#
# IMPORTANT (security):
#   * Relative paths resolve against THIS FILE's directory (docker/), so the
#     application sources are referenced as ../backend, ../frontend, ../nginx.
#   * ENVIRONMENT=production forces DEBUG=false and email verification via the
#     app's config validator. A strong SECRET_KEY (>= 32 chars) is REQUIRED:
#       export SECRET_KEY="$(python -c "import secrets; print(secrets.token_urlsafe(48))")"
#     or place SECRET_KEY=... in docker/.env before running `docker compose up`.
#   * nginx serves HTTPS only — provision certificates first:
#       mkdir -p ../nginx/certs && openssl req -x509 -newkey rsa:4096 -days 365 \
#         -nodes -keyout ../nginx/certs/privkey.pem -out ../nginx/certs/fullchain.pem \
#         -subj "/CN=localhost"
#   * Optional runtime settings (SMTP credentials, NVD_API_KEY, …) are read from
#     ../backend/.env when present.
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelscan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinelscan
      POSTGRES_USER: sentinelscan
      POSTGRES_PASSWORD: sentinelscan_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelscan"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinelscan_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sentinelscan_backend
    restart: unless-stopped
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinelscan:sentinelscan_pass@postgres:5432/sentinelscan
      SYNC_DATABASE_URL: postgresql://sentinelscan:sentinelscan_pass@postgres:5432/sentinelscan
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "false"
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      SECRET_KEY: '${SECRET_KEY:?SECRET_KEY is required for production. Generate one (min 32 chars) e.g. python -c "import secrets; print(secrets.token_urlsafe(48))" and export it or place it in docker/.env}'
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Live source bind-mount (original stack design) — image code is baked in
      # for deployments without the mount.
      - ../backend:/app
    # Alembic migrations run before the API starts — the DB schema is owned by
    # migrations, never by create_all.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sentinelscan_worker
    restart: unless-stopped
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinelscan:sentinelscan_pass@postgres:5432/sentinelscan
      SYNC_DATABASE_URL: postgresql://sentinelscan:sentinelscan_pass@postgres:5432/sentinelscan
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: '${SECRET_KEY:?SECRET_KEY is required for production. Generate one (min 32 chars) e.g. python -c "import secrets; print(secrets.token_urlsafe(48))" and export it or place it in docker/.env}'
      WORKER_CONCURRENCY: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    # Worker runs independently from the API — restarts do not affect API
    command: python run_worker.py
    # No port exposure — worker only communicates via Redis + DB

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sentinelscan_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next

  nginx:
    image: nginx:alpine
    container_name: sentinelscan_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS certificates must be provisioned before start (see header comment);
      # nginx refuses to boot with `listen 443 ssl` when they are missing.
      - ../nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
