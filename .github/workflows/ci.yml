name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test_sentinelscan.db
      SYNC_DATABASE_URL: sqlite:///./test_sentinelscan.db
      SECRET_KEY: test-ci-secret-key-at-least-32-characters-long
      DEBUG: "false"
      ENVIRONMENT: development
      REQUIRE_EMAIL_VERIFICATION: "true"
      DEV_BYPASS_EMAIL_VERIFICATION: "true"
      PYTHONPATH: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Pytest suite
        run: python -m pytest tests/ -v

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Production Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  security-and-repo-checks:
    name: Repository & Secret Safety Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify clean formatting and no whitespace errors
        run: git diff --check

      - name: Ensure no sensitive .env or credential files are tracked
        run: |
          TRACKED_SECRETS=$(git ls-files | grep -E '\.env$|\.env\.local$|\.pem$|\.key$|\.sqlite$|\.db$' || true)
          if [ -n "$TRACKED_SECRETS" ]; then
            echo "ERROR: Forbidden secret or local environment files tracked in Git:"
            echo "$TRACKED_SECRETS"
            exit 1
          fi
          echo "Secret audit passed: No private environment or key files are tracked."
