user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access_log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=scan_limit:10m rate=2r/s;

    # Upstream Services
    upstream backend_app {
        server backend:8000;
    }

    upstream frontend_app {
        server frontend:3000;
    }

    # HTTP to HTTPS Redirect
    server {
        listen 80;
        server_name sentinelscan.io www.sentinelscan.io;
        return 301 https://$host$request_uri;
    }

    # HTTPS Production Server
    server {
        listen 443 ssl http2;
        server_name sentinelscan.io www.sentinelscan.io;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # DENY (not SAMEORIGIN): the FastAPI backend (app/main.py) and the Next.js
        # frontend (next.config.js headers) ALREADY emit X-Frame-Options: DENY on their
        # own responses. If this nginx add_header still read SAMEORIGIN, clients would
        # receive TWO conflicting X-Frame-Options values on the same response — and
        # some browsers honor only the first. Keeping it DENY makes all three layers agree.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # ── Content-Security-Policy ──────────────────────────────────────────── #
        # Crafted for the actual Next.js 14 (App Router) bundle this frontend emits:
        #   * script-src 'unsafe-inline' — Next.js renders its hydration payload as
        #     inline <script> tags containing the RSC stream (self.__next_f). A
        #     nonce-based policy would require per-request nonce injection in Next
        #     middleware (broader architecture change) and is intentionally NOT done
        #     here; 'unsafe-inline' is the smallest working solution for THIS bundle.
        #   * 'unsafe-eval' is NOT allowed — no dependency requires it in production.
        #   * style-src 'unsafe-inline' — inline style attributes (Framer Motion,
        #     react-hot-toast) are emitted by this app.
        #   * fonts.googleapis.com / fonts.gstatic.com — Google Fonts (globals.css).
        #   * img-src lh3.googleusercontent.com + avatars.githubusercontent.com —
        #     next/image remotePatterns for OAuth profile pictures.
        #   * connect-src 'self' — axios + SSE are same-origin (nginx proxies /api/).
        #     If you split the API onto another origin, add it here.
        #   * worker-src blob: — tsparticles optional worker mode.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://lh3.googleusercontent.com https://avatars.githubusercontent.com; connect-src 'self'; worker-src 'self' blob:; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;

        # Frontend Routes
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI Backend API
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Real-time SSE Stream Endpoint (Disable Buffering)
        location /api/scans/ {
            # Rate limiting: allow burst of 5 (handles reconnects after network hiccup)
            # but caps the connect rate to prevent SSE connection exhaustion attacks.
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            # Disable Nginx's internal response buffer for SSE (text/event-stream)
            add_header X-Accel-Buffering "no";
            # SSE requires chunked transfer encoding
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
